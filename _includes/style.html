<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #222222;
  --heading-color: #000000;
  --muted-text: #666666;
  --subtle-text: #888888;
  --border-thick: #333333;
  --border-thin: #aaaaaa;
  --border-subtle: #e5e5e5;
  --link-color: #1E88E5;
  --link-hover: #1565C0;
  --btn-bg: #f5f7fa;
  --btn-border: #dcdfe6;
  --btn-text: #333333;
  --btn-hover-bg: #1E88E5;
  --btn-hover-text: #ffffff;
  --code-bg: #f6f6f6;
  --code-inline-bg: #f2f2f2;
  --code-border: #ddd;
}

[data-theme="dark"] {
  --bg-color: #141416;
  --text-color: #e2e8f0;
  --heading-color: #ffffff;
  --muted-text: #a0aec0;
  --subtle-text: #718096;
  --border-thick: #4a5568;
  --border-thin: #323b49;
  --border-subtle: #2d3748;
  --link-color: #64B5F6;
  --link-hover: #90CAF9;
  --btn-bg: #1e2638;
  --btn-border: #323d54;
  --btn-text: #e2e8f0;
  --btn-hover-bg: #1E88E5;
  --btn-hover-text: #ffffff;
  --code-bg: #1a202c;
  --code-inline-bg: #2d3748;
  --code-border: #4a5568;
}

*,*::before,*::after{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  font-family:'Merriweather',Georgia,serif;
  font-size:16px;
  line-height:1.65;
  color:var(--text-color);
  background-color:var(--bg-color);
  margin:0;
  padding:0;
  transition:background-color 0.25s ease, color 0.25s ease;
}

#wrapper{max-width:930px;margin:40px auto;padding:0 30px}

hr.thick{border:none;border-top:2px solid var(--border-thick);margin:0 0 18px}
hr.thin{border:none;border-top:1px solid var(--border-thin);margin:4px 0 14px}

h1.page-title{font-size:30px;font-weight:700;color:var(--heading-color);margin:0 0 6px;letter-spacing:.01em}
h2{font-size:17px;font-weight:700;color:var(--heading-color);margin:22px 0 0;text-transform:uppercase;letter-spacing:.12em;scroll-margin-top:24px}

p{margin:0 0 10px;font-size:16px}
ul{margin:0 0 12px;padding-left:20px}
li{margin-bottom:5px;font-size:16px}

a{color:var(--link-color);text-decoration:none;transition:color 0.15s ease}
a:hover{text-decoration:underline;color:var(--link-hover)}

footer{margin-top:60px;border-top:2px solid var(--border-thick);padding:18px 0 6px;font-size:12px;color:var(--muted-text);text-align:center}
footer .footer-meta{color:var(--subtle-text);font-size:11px}

/* Old-School Button Styles */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text-color);
  background-color: var(--btn-bg);
  border: 1px solid var(--border-thick);
  border-radius: 2px;
  text-decoration: none;
}

.back-link:hover {
  background-color: var(--code-inline-bg);
  color: var(--link-color);
  text-decoration: underline;
}

/* Accordion (Table of Contents page) */
.accordion-section{border-bottom:1px solid var(--border-thin)}
.accordion-section summary{list-style:none;cursor:pointer;padding:14px 0;font-size:17px;font-weight:700;color:var(--heading-color);text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;justify-content:space-between}
.accordion-section summary::-webkit-details-marker{display:none}
.accordion-section summary::after{content:"+";font-size:22px;font-weight:400;color:var(--link-color);margin-left:12px;transition:transform 0.2s ease}
.accordion-section[open] summary::after{content:"\2212"}
.accordion-list{padding:0 0 18px 4px;margin:0}
.accordion-list li{list-style:none;margin-bottom:10px}
.accordion-list .article-title{font-size:16px;font-weight:700;display:block}
.accordion-list .article-desc{font-size:14px;color:var(--muted-text);margin-top:2px}
.accordion-empty{font-size:15px;color:var(--muted-text);padding:0 0 18px 4px;margin:0}

/* Theme Toggle Icon Button (Old-School style, icon only) */
.theme-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 16px;
  color: var(--text-color);
  background-color: var(--btn-bg);
  border: 1px solid var(--border-thick);
  border-radius: 2px;
  cursor: pointer;
  user-select: none;
}

.theme-toggle-btn:hover {
  background-color: var(--code-inline-bg);
}

.page-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

/* Article page */
.article-meta{font-size:14px;color:var(--muted-text);margin:0 0 20px}
.article-body p{font-size:16px}

/* Code blocks */
.article-body pre,.article-body code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:14px}
.article-body code{background:var(--code-inline-bg);color:var(--text-color);padding:2px 5px;border-radius:3px}
.article-body pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:6px;padding:14px 16px;overflow-x:auto;line-height:1.5;margin:0 0 16px}
.article-body pre code{background:none;padding:0;border-radius:0}

/* Rouge syntax highlighting tokens */
.highlight .k,.highlight .kn{color:var(--link-color);font-weight:bold}
.highlight .s,.highlight .s1,.highlight .s2{color:#4caf50}
.highlight .c,.highlight .c1,.highlight .cm{color:var(--subtle-text);font-style:italic}
.highlight .n{color:var(--text-color)}
.highlight .nb{color:#ab47bc}
.highlight .nf{color:#ab47bc}
.highlight .mi,.highlight .mf{color:#ec407a}
.highlight .o{color:#ef5350}
.highlight .p{color:var(--text-color)}

/* Table of Contents (sticky, left of #wrapper) */
.toc-sidebar{position:fixed;top:100px;left:max(20px,calc(50% - 785px));width:240px;max-height:calc(100vh - 140px);overflow-y:auto;padding-right:14px}
.toc-sidebar .toc-title{font-size:12px;font-weight:700;color:var(--subtle-text);text-transform:uppercase;letter-spacing:.14em;margin:0 0 14px}
.toc-sidebar .toc-list{list-style:none;margin:0;padding:0}
.toc-sidebar .toc-list li{margin:0 0 2px}
.toc-sidebar .toc-list a{display:block;font-family:'Merriweather',Georgia,serif;font-size:16px;line-height:1.5;color:var(--text-color);text-decoration:none;padding:7px 0 7px 16px;border-left:2px solid var(--border-subtle);transition:color .15s ease,border-color .15s ease,border-width .15s ease}
.toc-sidebar .toc-list a:hover{color:var(--link-color);border-left-color:var(--link-color);text-decoration:none}
.toc-sidebar .toc-list a.active{color:var(--link-color);font-weight:700;border-left-width:5px;border-left-color:var(--link-color);padding-left:13px}

@media(max-width:1590px){.toc-sidebar{display:none}}
</style>
