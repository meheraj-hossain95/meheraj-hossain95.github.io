<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Meheraj Hossain</title>
  {% include style.html %}
  <script>
    // Initialize theme before render to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('index-theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="wrapper">

    <div class="page-header-row">
      <a class="back-link" href="/index/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Index</span>
      </a>
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle dark/light mode">
        <span id="themeToggleIcon" style="display: flex; align-items: center;"></span>
      </button>
    </div>

    <h1 class="page-title">{{ page.title }}</h1>
    <p class="article-meta">
      {{ page.section_name }}{% if page.date %} &nbsp;&middot;&nbsp; {{ page.date | date: "%B %-d, %Y" }}{% endif %}
    </p>

    <hr class="thick">

    <main class="article-body">
      {{ content }}
    </main>

    <footer>
      <div class="footer-meta">&copy; 2026 Meheraj Hossain</div>
    </footer>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggleBtn = document.getElementById('themeToggleBtn');
      const toggleIcon = document.getElementById('themeToggleIcon');
      const moonIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
      const sunIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

      function updateUI() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (toggleIcon) {
          toggleIcon.innerHTML = isDark ? sunIcon : moonIcon;
        }
        if (toggleBtn) {
          toggleBtn.setAttribute('title', isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode');
        }
      }

      updateUI();

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('index-theme', newTheme);
          updateUI();
        });
      }

      var article = document.querySelector('.article-body');
      if (!article) return;

      var headings = article.querySelectorAll('h2');
      if (!headings.length) return;

      // Build the sidebar
      var toc = document.createElement('nav');
      toc.className = 'toc-sidebar';
      toc.setAttribute('aria-label', 'Table of contents');

      var title = document.createElement('div');
      title.className = 'toc-title';
      title.textContent = 'Contents';
      toc.appendChild(title);

      var list = document.createElement('ul');
      list.className = 'toc-list';

      headings.forEach(function (heading, i) {
        // Ensure every heading has a stable id to link to
        if (!heading.id) {
          var slug = heading.textContent
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/(^-|-$)/g, '');
          heading.id = slug || 'section-' + i;
        }

        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent;

        a.addEventListener('click', function (e) {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.pushState(null, '', '#' + heading.id);
        });

        li.appendChild(a);
        list.appendChild(li);
      });

      toc.appendChild(list);
      document.body.appendChild(toc);

      // Highlight the section currently in view
      var links = toc.querySelectorAll('.toc-list a');
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var link = toc.querySelector('a[href="#' + entry.target.id + '"]');
          if (!link) return;
          if (entry.isIntersecting) {
            links.forEach(function (l) { l.classList.remove('active'); });
            link.classList.add('active');
          }
        });
      }, { rootMargin: '-20% 0px -70% 0px' });

      headings.forEach(function (h) { observer.observe(h); });
    });
  </script>

</body>

</html>
